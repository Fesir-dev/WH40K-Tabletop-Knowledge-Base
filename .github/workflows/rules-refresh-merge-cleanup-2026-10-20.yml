name: Rules refresh merge cleanup 2026-10-20

on:
  push:
    branches:
      - ops/rules-refresh-2026-10-20
    paths:
      - ".github/workflows/rules-refresh-merge-cleanup-2026-10-20.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-refresh-merge-cleanup-2026-10-20
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rules-refresh-2026-10-20
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore immutable historical snapshot and remove one-off migration tooling
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- rules/11e/snapshots/2026-09-29/wahapedia/roster_views
          git rm -f \
            .github/workflows/rules-refresh-mfm-v1-6.yml \
            .github/workflows/rules-refresh-release-transition-finalize-2026-10-20.yml \
            .github/workflows/rules-refresh-runtime-2026-10-20.yml \
            .github/workflows/rules-refresh-runtime-finalize-2026-10-20.yml \
            .github/workflows/rules-refresh-secondary-2026-10-20.yml \
            tools/finalize_release_transition_refresh.py \
            tools/finalize_runtime_refresh.py \
            tools/patch_release_transition_repository_tests.py \
            tools/patch_rules_refresh_tests.py \
            tools/patch_rules_refresh_validation_contracts.py \
            .github/workflows/rules-refresh-merge-cleanup-2026-10-20.yml

      - name: Validate cleaned merge candidate
        run: |
          python -m compileall -q tools legacy tests
          python tools/validate_repo.py
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check

      - name: Commit merge cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean rules refresh migration artifacts"
          git fetch origin ops/rules-refresh-2026-10-20
          git rebase origin/ops/rules-refresh-2026-10-20
          git push origin HEAD:ops/rules-refresh-2026-10-20
