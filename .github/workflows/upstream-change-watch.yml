name: Upstream change watch

on:
  push:
    paths:
      - "tools/watch_upstreams.py"
      - ".github/workflows/upstream-change-watch.yml"
      - "sources/registry.json"
      - "rules/11e/snapshots/2026-09-29/wahapedia/manifest.json"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check upstream revisions and file hashes
        id: watch
        shell: bash
        run: |
          set +e
          python tools/watch_upstreams.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit deterministic watch report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/UPSTREAM_CHANGE_WATCH_CURRENT.json
          if git diff --cached --quiet; then
            echo "No watch-report changes"
          else
            git commit -m "Refresh upstream change watch"
            git push
          fi
      - name: Fail on upstream change
        if: steps.watch.outputs.code != '0'
        run: |
          echo "Upstream change detected; review reports/UPSTREAM_CHANGE_WATCH_CURRENT.json"
          exit 2
