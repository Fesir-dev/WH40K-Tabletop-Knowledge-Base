name: Rules refresh runtime validation 2026-10-20

on:
  push:
    branches:
      - ops/rules-refresh-2026-10-20
    paths:
      - ".github/workflows/rules-refresh-runtime-2026-10-20.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-refresh-runtime-2026-10-20
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rules-refresh-2026-10-20
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate New Recruit against current pointers
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/validate_new_recruit_runtime_current.py | tee .cache-runtime-output.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f reports/NEW_RECRUIT_RUNTIME_VALIDATION_CURRENT.json

      - name: Record runtime checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('reports/NEW_RECRUIT_RUNTIME_VALIDATION_CURRENT.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          c=json.load(open('rules/11e/current.json',encoding='utf-8'))
          prov=r.get('provenance',{}).get('current_rules',{})
          assert prov.get('mfm_version')=='1.6', prov
          assert prov.get('mfm_last_updated')=='2026-10-14', prov
          assert prov.get('wahapedia_last_update')=='2026-10-19 03:47:32', prov
          assert prov.get('bsdata_revision')=='a56674583d9f656a191e4210268c276f133b47d1', prov
          summary={
              'schema_version':'1.0',
              'as_of':'2026-10-20',
              'status':r.get('status'),
              'mfm_version':prov.get('mfm_version'),
              'wahapedia_last_update':prov.get('wahapedia_last_update'),
              'bsdata_revision':prov.get('bsdata_revision'),
              'resolved_runtime_identities':r.get('universe',{}).get('resolved_runtime_identities'),
              'representative_points':{
                  'checks':r.get('representative_points',{}).get('checks'),
                  'matches':r.get('representative_points',{}).get('match_count'),
                  'known_drifts':r.get('representative_points',{}).get('known_drift_count'),
                  'new_drifts':r.get('representative_points',{}).get('new_drift_count'),
              },
              'runtime_surfaces':{
                  'checks':r.get('representative_surfaces',{}).get('checks'),
                  'matches':r.get('representative_surfaces',{}).get('match_count'),
                  'known_drifts':r.get('representative_surfaces',{}).get('known_drift_count'),
                  'new_drifts':r.get('representative_surfaces',{}).get('new_drift_count'),
              },
              'authority_boundary':'Runtime projection drift never mutates normative GW/MFM rules truth.',
          }
          out=pathlib.Path('reports/RULES_REFRESH_RUNTIME_2026-10-20.json')
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-refresh-runtime-${{ github.run_id }}
          path: |
            reports/NEW_RECRUIT_RUNTIME_VALIDATION_CURRENT.json
            reports/RULES_REFRESH_RUNTIME_2026-10-20.json
            .cache-runtime-output.txt
          retention-days: 30

      - name: Commit durable runtime evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/NEW_RECRUIT_RUNTIME_VALIDATION_CURRENT.json reports/RULES_REFRESH_RUNTIME_2026-10-20.json
          git diff --cached --check
          git commit -m "Validate current New Recruit runtime projection"
          git fetch origin ops/rules-refresh-2026-10-20
          git rebase origin/ops/rules-refresh-2026-10-20
          git push origin HEAD:ops/rules-refresh-2026-10-20

      - name: Preserve fail-closed runtime state
        if: steps.runtime.outcome == 'failure'
        run: |
          echo "Runtime validation found new/unclassified drift. Normative rules remain unchanged; review committed evidence."
          exit 2
