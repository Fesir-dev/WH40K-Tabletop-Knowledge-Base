name: Current semantic resolver smoke

on:
  push:
    paths:
      - "tools/query_current_semantics.py"
      - ".github/workflows/semantic-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify live semantic fingerprints
        run: python tools/query_current_semantics.py --smoke-test
