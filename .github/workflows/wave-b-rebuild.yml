name: Wave B roster-view rebuild

on:
  push:
    paths:
      - "tools/build_wave_b_roster_views.py"
      - ".github/workflows/wave-b-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build roster-specific structural views from committed snapshot
        run: python tools/build_wave_b_roster_views.py
      - name: Validate roster-view contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("rules/11e/snapshots/2026-09-29/wahapedia/roster_views/index.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["counts"]=={"roster_identities":37,"structural_complete":35,"structural_partial":0,"unavailable":2}, d["counts"]
          unavailable={x["slug"] for x in d["views"] if x["status"].startswith("UNAVAILABLE")}
          assert unavailable=={"titanicus_traitoris","unaligned_forces"}, unavailable
          print("Wave B roster views: PASS", d["counts"])
          PY
      - name: Commit rebuilt roster views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/11e/snapshots/2026-09-29/wahapedia/roster_views
          if git diff --cached --quiet; then
            echo "No roster-view changes"
          else
            git commit -m "Rebuild Wave B roster-specific views"
            git push
          fi
