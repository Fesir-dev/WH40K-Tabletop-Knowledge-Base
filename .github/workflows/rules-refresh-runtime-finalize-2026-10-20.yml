name: Rules refresh runtime finalize 2026-10-20

on:
  push:
    branches:
      - ops/rules-refresh-2026-10-20
    paths:
      - ".github/workflows/rules-refresh-runtime-finalize-2026-10-20.yml"
      - "tools/patch_rules_refresh_tests.py"
      - "tools/patch_rules_refresh_validation_contracts.py"
      - "tools/finalize_runtime_refresh.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-refresh-runtime-finalize-2026-10-20
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rules-refresh-2026-10-20
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch refresh-aware repository contracts
        run: |
          python tools/patch_rules_refresh_validation_contracts.py
          python tools/patch_rules_refresh_tests.py

      - name: Classify current runtime drift
        run: python tools/finalize_runtime_refresh.py prepare-registry

      - name: Revalidate runtime with classified registry
        run: |
          python tools/validate_new_recruit_runtime_current.py
          python - <<'PY'
          import json
          r=json.load(open('reports/NEW_RECRUIT_RUNTIME_VALIDATION_CURRENT.json',encoding='utf-8'))
          p=r['representative_points']; s=r['representative_surfaces']
          assert r['status']=='PASS_WITH_KNOWN_RUNTIME_DRIFT', r['status']
          assert p['checks']==15 and p['matched']==14 and p['known_drift_count']==1 and p['new_drift_count']==0, p
          assert s['checks']==5 and s['matched']==5 and s['known_drift_count']==0 and s['new_drift_count']==0, s
          d=p['known_drifts'][0]
          assert d['unit']=='Trajann Valoris' and d['gw_mfm_value']==265 and d['new_recruit_runtime_value']==135, d
          print('classified runtime validation: PASS_WITH_KNOWN_RUNTIME_DRIFT')
          PY

      - name: Refresh watcher and synchronize runtime/current pointers
        shell: bash
        run: |
          set +e
          python tools/watch_upstreams.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          python tools/finalize_runtime_refresh.py sync-current

      - name: Validate repository after runtime reconciliation
        run: |
          python -m compileall -q tools legacy tests
          python tools/validate_repo.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit runtime finalization milestone
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/validate_repo.py \
            tests/test_repository_contracts.py \
            sources/runtime_drift_registry.json \
            sources/profiles/new_recruit_bsdata_11e.json \
            reports/NEW_RECRUIT_RUNTIME_VALIDATION_CURRENT.json \
            reports/UPSTREAM_CHANGE_WATCH_CURRENT.json \
            rules/11e/current.json
          git diff --cached --check
          git commit -m "Reconcile current runtime projection after rules refresh"
          git fetch origin ops/rules-refresh-2026-10-20
          git rebase origin/ops/rules-refresh-2026-10-20
          git push origin HEAD:ops/rules-refresh-2026-10-20
