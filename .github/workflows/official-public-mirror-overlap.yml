name: Official public mirror overlap audit

on:
  push:
    paths:
      - "tools/audit_official_public_mirror_overlap.py"
      - "tools/validate_official_public_overlap_checkpoint.py"
      - "tests/test_official_public_mirror_overlap.py"
      - "schemas/official_public_mirror_overlap.schema.json"
      - "schemas/official_public_overlap_snapshot.schema.json"
      - "docs/OFFICIAL_PUBLIC_MIRROR_OVERLAP_MODEL.md"
      - "reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json"
      - "reports/OFFICIAL_PUBLIC_MIRROR_OVERLAP_CURRENT.json"
      - "reports/OFFICIAL_PUBLIC_MIRROR_OVERLAP_SUMMARY_CURRENT.json"
      - "rules/11e/snapshots/2026-09-30/official_public_overlap/index.json"
      - ".github/workflows/official-public-mirror-overlap.yml"
  pull_request:
    paths:
      - "tools/audit_official_public_mirror_overlap.py"
      - "tools/validate_official_public_overlap_checkpoint.py"
      - "tests/test_official_public_mirror_overlap.py"
      - "schemas/official_public_mirror_overlap.schema.json"
      - "schemas/official_public_overlap_snapshot.schema.json"
      - "docs/OFFICIAL_PUBLIC_MIRROR_OVERLAP_MODEL.md"
      - "reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json"
      - "reports/OFFICIAL_PUBLIC_MIRROR_OVERLAP_CURRENT.json"
      - "reports/OFFICIAL_PUBLIC_MIRROR_OVERLAP_SUMMARY_CURRENT.json"
      - "rules/11e/snapshots/2026-09-30/official_public_overlap/index.json"
      - ".github/workflows/official-public-mirror-overlap.yml"
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run overlap contracts
        run: |
          python -m compileall -q tools/audit_official_public_mirror_overlap.py tools/validate_official_public_overlap_checkpoint.py tests/test_official_public_mirror_overlap.py
          python -m unittest tests.test_official_public_mirror_overlap -v

      - name: Validate immutable 2026-09-30 public overlap checkpoint
        run: python tools/validate_official_public_overlap_checkpoint.py

      - uses: actions/upload-artifact@v4
        with:
          name: official-public-mirror-overlap-${{ github.run_id }}
          path: |
            reports/OFFICIAL_PUBLIC_MIRROR_OVERLAP_CURRENT.json
            reports/OFFICIAL_PUBLIC_MIRROR_OVERLAP_SUMMARY_CURRENT.json
            rules/11e/snapshots/2026-09-30/official_public_overlap/index.json
          if-no-files-found: error
