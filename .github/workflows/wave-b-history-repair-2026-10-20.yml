name: Restore immutable Wave B history 2026-10-20

on:
  push:
    branches:
      - ops/fix-wave-b-history-2026-10-20
    paths:
      - ".github/workflows/wave-b-history-repair-2026-10-20.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave-b-history-repair-2026-10-20
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/fix-wave-b-history-2026-10-20
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore immutable 2026-09-29 roster views
        shell: bash
        run: |
          git checkout 4b99304643ed415aa0819f86f91b1ff50cde0bc4 -- \
            rules/11e/snapshots/2026-09-29/wahapedia/roster_views

      - name: Prove default builder touches current snapshot only
        shell: bash
        run: |
          python tools/build_wave_b_roster_views.py
          git diff --exit-code 4b99304643ed415aa0819f86f91b1ff50cde0bc4 -- \
            rules/11e/snapshots/2026-09-29/wahapedia/roster_views
          python - <<'PY'
          import json
          from pathlib import Path
          current=json.load(open('rules/11e/current.json',encoding='utf-8'))
          p=Path(current['wave_b_structural']['snapshot'])
          d=json.load(open(p,encoding='utf-8'))
          assert d['snapshot_date']=='2026-10-20', d['snapshot_date']
          assert d['counts']=={'roster_identities':37,'structural_complete':35,'structural_partial':0,'unavailable':2}, d['counts']
          old=json.load(open('rules/11e/snapshots/2026-09-29/wahapedia/roster_views/index.json',encoding='utf-8'))
          assert old['schema_version']=='1.0', old['schema_version']
          assert old['snapshot_date']=='2026-09-29', old['snapshot_date']
          print('Wave B immutable-history guard: PASS')
          PY

      - name: Validate repository
        run: |
          python -m compileall -q tools legacy tests
          python tools/validate_repo.py
          python -m unittest discover -s tests -p 'test_*.py'
          git diff --check

      - name: Commit repair and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/wave-b-history-repair-2026-10-20.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore immutable Wave B historical snapshot"
          git fetch origin ops/fix-wave-b-history-2026-10-20
          git rebase origin/ops/fix-wave-b-history-2026-10-20
          git push origin HEAD:ops/fix-wave-b-history-2026-10-20
