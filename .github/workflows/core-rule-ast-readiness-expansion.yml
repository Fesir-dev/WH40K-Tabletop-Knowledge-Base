name: Core rule AST readiness expansion

on:
  push:
    paths:
      - "tools/audit_core_rule_ast_readiness_expansion.py"
      - "tests/test_core_rule_ast_readiness_expansion.py"
      - "docs/CORE_RULE_AST_READINESS_EXPANSION_MODEL.md"
      - "schemas/core_rule_ast_readiness_expansion.schema.json"
      - "rules/11e/snapshots/2026-09-30/core_rule_semantic_ast_readiness/index.json"
      - "reports/CORE_RULE_DIRECT_MODAL_AST_SEMANTIC_VALIDATION_CURRENT.json"
      - ".github/workflows/core-rule-ast-readiness-expansion.yml"
  pull_request:
    paths:
      - "tools/audit_core_rule_ast_readiness_expansion.py"
      - "tests/test_core_rule_ast_readiness_expansion.py"
      - "docs/CORE_RULE_AST_READINESS_EXPANSION_MODEL.md"
      - "schemas/core_rule_ast_readiness_expansion.schema.json"
      - "rules/11e/snapshots/2026-09-30/core_rule_semantic_ast_readiness/index.json"
      - "reports/CORE_RULE_DIRECT_MODAL_AST_SEMANTIC_VALIDATION_CURRENT.json"
      - ".github/workflows/core-rule-ast-readiness-expansion.yml"
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PDF extractor
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Compile and run expansion contracts
        run: |
          python -m compileall -q tools/audit_core_rule_ast_readiness_expansion.py tests/test_core_rule_ast_readiness_expansion.py
          python -m unittest tests.test_core_rule_ast_readiness_expansion -v
      - uses: actions/cache@v4
        with:
          path: .cache/official-public-rules
          key: official-public-rules-${{ hashFiles('sources/discoveries/gw_public_rules_surface_2026-09-29.json', 'sources/snapshots/gw_11e_official_assets_2026-09-29.json') }}
      - name: Audit the 33 source-shape-blocked paragraphs
        run: |
          python tools/audit_core_rule_ast_readiness_expansion.py \
            --as-of 2026-09-30 \
            --output rules/11e/snapshots/2026-09-30/core_rule_ast_readiness_expansion/index.json \
            --summary-output reports/CORE_RULE_AST_READINESS_EXPANSION_CURRENT.json
      - name: Enforce expansion scope and authority boundary
        run: |
          python - <<'PY'
          import json
          p='rules/11e/snapshots/2026-09-30/core_rule_ast_readiness_expansion/index.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['status']=='PASS'
          s=r['summary']
          assert s['rows_audited']==33
          assert s['unique_paragraph_keys']==33
          assert s['parent_state_counts']=={
            'BLOCKED_COMPLEX_DELIMITERS':4,
            'BLOCKED_PARENTHETICAL_SCOPE':1,
            'BLOCKED_SENTENCE_SHAPE':28,
          }
          assert s['source_hashes_reproduced']==33
          assert s['new_ast_nodes_created']==0
          assert s['interaction_edges_created']==0
          assert s['existing_ast_nodes_mutated']==0
          assert s['additional_paragraphs_admitted']==0
          assert r['validated_existing_ast']['decision']=='OPAQUE_PRESERVED'
          assert r['validated_existing_ast']['ast_mutated'] is False
          assert r['authority_boundary']['sentence_candidate_is_not_ast_node'] is True
          assert r['authority_boundary']['ast_nodes_created'] is False
          assert r['authority_boundary']['interaction_edges_created'] is False
          assert r['authority_boundary']['existing_ast_mutated'] is False
          assert r['authority_boundary']['current_normalized_factions_change']==0
          assert all(x['ast_node_created'] is False for x in r['rows'])
          assert all(x['interaction_edges_created']==0 for x in r['rows'])
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-rule-ast-readiness-expansion-${{ github.run_id }}
          path: |
            reports/CORE_RULE_AST_READINESS_EXPANSION_CURRENT.json
            rules/11e/snapshots/2026-09-30/core_rule_ast_readiness_expansion/index.json
          if-no-files-found: error
      - name: Commit generated readiness expansion on development branch
        if: github.event_name == 'push' && github.ref_name != 'main' && github.actor != 'github-actions[bot]'
        run: |
          if [ -z "$(git status --porcelain -- reports/CORE_RULE_AST_READINESS_EXPANSION_CURRENT.json rules/11e/snapshots/2026-09-30/core_rule_ast_readiness_expansion/index.json)" ]; then
            echo "Readiness expansion already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/CORE_RULE_AST_READINESS_EXPANSION_CURRENT.json
          git add rules/11e/snapshots/2026-09-30/core_rule_ast_readiness_expansion/index.json
          git commit -m "Checkpoint generated AST readiness expansion"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Assert scheduled committed reproducibility
        if: github.event_name == 'schedule'
        run: git diff --exit-code -- reports/CORE_RULE_AST_READINESS_EXPANSION_CURRENT.json rules/11e/snapshots/2026-09-30/core_rule_ast_readiness_expansion/index.json
