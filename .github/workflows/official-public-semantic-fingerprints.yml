name: Official public rules semantic fingerprints

on:
  push:
    paths:
      - "tools/build_official_public_semantic_fingerprints.py"
      - "tests/test_official_public_semantic_fingerprints.py"
      - "schemas/official_public_semantic_fingerprint.schema.json"
      - "sources/discoveries/gw_public_rules_surface_2026-09-29.json"
      - "sources/snapshots/gw_11e_official_assets_2026-09-29.json"
      - ".github/workflows/official-public-semantic-fingerprints.yml"
  pull_request:
    paths:
      - "tools/build_official_public_semantic_fingerprints.py"
      - "tests/test_official_public_semantic_fingerprints.py"
      - "schemas/official_public_semantic_fingerprint.schema.json"
      - "sources/discoveries/gw_public_rules_surface_2026-09-29.json"
      - "sources/snapshots/gw_11e_official_assets_2026-09-29.json"
      - ".github/workflows/official-public-semantic-fingerprints.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PDF extractor
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0

      - name: Compile and run unit contracts
        run: |
          python -m compileall -q tools/build_official_public_semantic_fingerprints.py tests/test_official_public_semantic_fingerprints.py
          python -m unittest tests.test_official_public_semantic_fingerprints -v

      - uses: actions/cache@v4
        with:
          path: .cache/official-public-rules
          key: official-public-rules-${{ hashFiles('sources/discoveries/gw_public_rules_surface_2026-09-29.json', 'sources/snapshots/gw_11e_official_assets_2026-09-29.json') }}

      - name: Build full official public fingerprint corpus
        run: |
          python tools/build_official_public_semantic_fingerprints.py \
            --as-of 2026-09-29 \
            --output reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json

      - name: Validate generated corpus boundary
        run: |
          python - <<'PY'
          import json
          p='reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['status']=='PASS', r.get('failures')
          s=r['summary']
          assert s['documents']==29, s
          assert s['core_rules']==1, s
          assert s['faction_packs']==28, s
          assert s['verified']==29, s
          assert s['failures']==0, s
          assert s['pages']>0 and s['text_chars']>0, s
          assert all('text' not in page for d in r['documents'] for page in d['pages'])
          assert all(d['verification']=='PASS' for d in r['documents'])
          print(json.dumps(s,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: official-public-semantic-fingerprints-${{ github.run_id }}
          path: reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json
          if-no-files-found: error

      - name: Commit generated report on push
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          if [ -z "$(git status --porcelain -- reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json)" ]; then
            echo "Fingerprint report already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/OFFICIAL_PUBLIC_RULES_SEMANTIC_FINGERPRINT_CURRENT.json
          git commit -m "Refresh official public semantic fingerprint corpus"
          git push origin HEAD:${GITHUB_REF_NAME}
